<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Stock Tracker</title>
  <meta name="description" content="Work inventory tracker: counts, barcode scanning, min-stock alerts, inventory counts and Excel export.">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f6f8">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f172a">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Stock">
  <link rel="stylesheet" href="./css/app.css">
  <script defer src="./vendor/sheetjs/xlsx.full.min.js"></script>
  <script defer src="./vendor/barcode-detector/ponyfill.js"></script>
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <div id="app">
    <section id="screen-home" class="screen"></section>
    <section id="screen-scan" class="screen screen-scan" hidden>
      <video id="scan-video" playsinline muted autoplay></video>
      <div id="scan-ui"></div>
    </section>
    <section id="screen-item" class="screen" hidden></section>
    <section id="screen-stocktake" class="screen" hidden></section>
    <section id="screen-review" class="screen" hidden></section>
    <section id="screen-settings" class="screen" hidden></section>
    <section id="screen-team" class="screen" hidden></section>
    <section id="screen-catalog" class="screen" hidden></section>
    <section id="screen-insights" class="screen" hidden></section>
  </div>
  <div id="sheet-root"></div>
  <div id="toast-root"></div>
  <noscript><p style="padding:2rem">Stock Tracker needs JavaScript enabled.</p></noscript>
</body>
</html>
